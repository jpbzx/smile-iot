services:
  # Base de dados para Utilizadores e Permissões
  postgres_db:
    image: postgres:15
    container_name: smile_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # Base de dados para Histórico de Energia (Séries Temporais)
  influx_db:
    image: influxdb:2.7
    container_name: smile_influx
    restart: always
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    volumes:
      - ./data/influx:/var/lib/influxdb2

  # Dashboard Streamlit
  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smile_dashboard
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - postgres_db
      - influx_db
    env_file: .env
    environment:
      # Sobrescrevemos os hosts para a rede interna do Docker
      - POSTGRES_HOST=postgres_db
      - INFLUX_URL=http://influx_db:8086